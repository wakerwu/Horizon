name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. 20:00 UTC is 04:00 Asia/Shanghai;
    # this intentionally runs early to offset the observed schedule delay.
    - cron: '0 23 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Preflight diagnostics
        env:
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          {
            echo "=== 环境自检 $(date -u +%FT%TZ) ==="
            echo "python: $(python --version 2>&1)"
            echo "uv: $(uv --version 2>&1)"
            echo "Secret DEEPSEEK 长度: ${#DEEPSEEK}"
            echo "Secret DEEPSEEK_API_KEY 长度: ${#DEEPSEEK_API_KEY}"
            if [ -n "$DEEPSEEK" ] || [ -n "$DEEPSEEK_API_KEY" ]; then
              echo "结论: Secret 已注入（值不打印）"
            else
              echo "结论: 两个名字都为空 —— 检查是否加在 Repository secrets 下"
            fi
          } 2>&1 | tee horizon-run.log
          echo "preflight done"

      - name: Run Horizon
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your data/config.github.json provider settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: |
          set -o pipefail
          uv run horizon --hours 24 2>&1 | tee -a horizon-run.log

      - name: Set current date as environment variable
        if: always()
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # 把运行日志回传到仓库，便于在没有管理员权限的情况下排查失败原因
      - name: Upload run log to repo
        if: failure()
        run: |
          mkdir -p run-logs
          if [ -f horizon-run.log ]; then
            cp horizon-run.log "run-logs/run-${DATE}.txt"
          else
            echo "(no log file produced)" > "run-logs/run-${DATE}.txt"
          fi
          git config user.name "horizon-bot"
          git config user.email "horizon-bot@users.noreply.github.com"
          git add run-logs
          git commit -m "chore: run log ${DATE}" || echo "nothing to commit"
          git pull --rebase || true
          git push || echo "push failed"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
